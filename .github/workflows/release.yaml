name: Release

# Actions → Release → "Run workflow": enter the new version. Everything else
# (tests, version in manifest.json, changelog, tag v<version>, GitHub release
# under the owner's name) is done by the shared workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 1.2.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: mw-hbg/workflows/.github/workflows/ha-integration-release.yml@main
    with:
      domain: whereabouts
      version: ${{ inputs.version }}
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}
