name: Test

# Runs for every pull request and every push to main. Nothing is published
# here; releases are made with the "Release" workflow (Actions → Release).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    uses: mw-hbg/workflows/.github/workflows/ha-integration-test.yml@main
    with:
      domain: whereabouts

  translations:
    uses: mw-hbg/workflows/.github/workflows/translations-check.yml@main
    with:
      groups: |
        custom_components/whereabouts/strings.json custom_components/whereabouts/translations/*.json
        custom_components/whereabouts/frontend/i18n/*.json
